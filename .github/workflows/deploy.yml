name: Deploy to AWS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: focowebsites.com
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  # web3forms access keys are public by design and are guarded by hCaptcha plus
  # rate limiting, not by secrecy. Nuxt inlines runtimeConfig.public into the client
  # bundle at generate time, so this value is readable in the shipped JS whether it
  # comes from a secret or from here. Declaring it avoids a second copy that can
  # drift out of sync with the dashboard.
  NUXT_PUBLIC_WEB3FORMS_ACCESS_KEY: 8018aaea-c7d9-4e7c-89e5-68a035e51da9

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generate static site
        run: npm run generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/public/
          retention-days: 1

  deploy:
    name: Deploy to S3 + Invalidate CloudFront
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .output/public/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsDeploy

      - name: Sync hashed build assets to S3
        run: |
          aws s3 sync .output/public/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "_nuxt/*"

      - name: Sync unhashed static files to S3
        run: |
          aws s3 sync .output/public/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=86400" \
            --exclude "*" \
            --include "images/*" \
            --include "favicon.ico" \
            --include "__sitemap__/*"

      - name: Sync HTML/XML/JSON with no-cache
        run: |
          aws s3 sync .output/public/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.json" \
            --include "robots.txt"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Verify deployment
        run: |
          echo "Deployment complete! Site available at https://focowebsites.com"